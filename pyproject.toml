[project]
name = "mediaboard"
version = "0.1.0"
description = "CSFD Top 300 Movies Search Application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "unidecode>=1.3",
    "gunicorn>=23.0",
    "typer>=0.12",
    "playwright>=1.40",
    "httpx[http2]>=0.28.1",
    "curl-cffi>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[project.scripts]
manage = "manage:app"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
